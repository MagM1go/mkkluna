[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "luna"
version = "0.1.0"
description = "REST API для справочника"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.18.4",
    "fastapi>=0.135.1",
    "psycopg[binary,pool]>=3.3.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "sqlalchemy[asyncio]>=2.0.48",
    "uvicorn[standard]>=0.42.0",
]

[project.scripts]
luna = "luna.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.15.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/luna"]

[tool.hatch.build.targets.wheel.force-include]
"src/luna/py.typed" = "luna/py.typed"

[tool.hatch.build.targets.sdist]
include = [
    "src/luna",
    "README.md",
    "pyproject.toml",
]

[tool.mypy]
python_version = "3.14"
packages = ["luna"]
mypy_path = "src"
strict = true
explicit_package_bases = true
show_error_codes = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
